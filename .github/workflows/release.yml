name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  server-binaries:
    name: Build server binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-GO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Backend-GO/go.sum

      - name: Build (linux/amd64, linux/arm64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/AndroControl-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/AndroControl-linux-arm64 .
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Extract release notes from CHANGELOG
        working-directory: ${{ github.workspace }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          echo "----- release notes -----"; cat release_notes.md

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: Backend-GO/dist/*
          body_path: release_notes.md
          fail_on_unmatched_files: true

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: server-binaries   # attach to the release the server job created
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Decode the signing keystore if the secret is configured. When it isn't, the
      # job builds a (debug-signed, installable) debug APK instead, so a release always
      # ships an APK. Add these repo secrets for a proper signed release APK:
      #   ANDROCONTROL_KEYSTORE_BASE64  (base64 of your .jks)
      #   ANDROCONTROL_KEYSTORE_PASSWORD, ANDROCONTROL_KEY_ALIAS, ANDROCONTROL_KEY_PASSWORD
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROCONTROL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/androcontrol.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: Frontend
        env:
          ANDROCONTROL_KEYSTORE_PASSWORD: ${{ secrets.ANDROCONTROL_KEYSTORE_PASSWORD }}
          ANDROCONTROL_KEY_ALIAS: ${{ secrets.ANDROCONTROL_KEY_ALIAS }}
          ANDROCONTROL_KEY_PASSWORD: ${{ secrets.ANDROCONTROL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../apk
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            export ANDROCONTROL_KEYSTORE="$RUNNER_TEMP/androcontrol.jks"
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "../apk/AndroControl-${GITHUB_REF_NAME}.apk"
          else
            echo "::warning::No signing keystore secret set — building a debug APK."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "../apk/AndroControl-${GITHUB_REF_NAME}-debug.apk"
          fi
          (cd ../apk && sha256sum AndroControl-*.apk > APK-SHA256SUMS)

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*
          fail_on_unmatched_files: true
