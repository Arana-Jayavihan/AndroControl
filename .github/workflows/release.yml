name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  server-binaries:
    name: Build server binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-GO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Backend-GO/go.sum

      - name: Build (linux/amd64, linux/arm64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/AndroControl-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/AndroControl-linux-arm64 .
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: Backend-GO/dist/*
