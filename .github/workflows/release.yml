name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  server-binaries:
    name: Build server binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-GO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Backend-GO/go.sum

      - name: Build (linux/amd64, linux/arm64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/AndroControl-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/AndroControl-linux-arm64 .
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Extract release notes from CHANGELOG
        working-directory: ${{ github.workspace }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          echo "----- release notes -----"; cat release_notes.md

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: Backend-GO/dist/*
          body_path: release_notes.md
          fail_on_unmatched_files: true
